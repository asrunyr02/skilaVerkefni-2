<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Quest to complete</h1>
    </header>
    <main>
      <div class="todo">
        <div id="total-quest" class="box a">Total quest</div>
        <div id="finished-count" class="box b">Quest finished</div>
        <div id="unfinished-count" class="box c">Quest unfinished</div>
      </div>
      <section class="add">
        <div class="input-group">
          <h2>Add quest</h2>
          <form class="quest-form">
            <div class="form-row">
              <label for="add">Name of quest</label>
              <input type="text" id="add" placeholder="Quest add" />
              <button type="button" id="add-btn">Add to</button>
            </div>
          </form>
        </div>
      </section>
      <section class="Quest">
        <h2>Quest</h2>
        <div id="quest-list"></div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Ásrún</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
