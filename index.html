<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do list</title>
    <link rel="stylesheet" href="style.css" />
    <script scr="script.js"></script>
  </head>
  <body>
    <header>
      <h1>Quest to complete</h1>
    </header>
    <main>
      <div class="todo">
        <div class="box a">Total quest</div>
        <div class="box b">Quest finished</div>
        <div class="box c">Quest unfinished</div>
      </div>
      <section class="add">
        <div class="input-group">
          <h2>Add quest</h2>
          <div class="form-row">
            <label for="add">Name of quest</label>
            <input type="text" id="add" placeholder="Quest add" />
            <button type="submit">Add to</button>
          </div>
        </div>
      </section>
      <section class="Quest">
        <div class="input-group">
          <h2>Quest</h2>
        </div>
      </section>
    </main>
  </body>
</html>
